plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
    id("de.kevin_stefan.minecraft.shared-gradle-plugin") version "1.0.0"
    id("com.gradleup.shadow") version "9.4.1"
}

group = 'de.kevin_stefan'
version = '1.3.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = uri("https://maven.pkg.github.com/TheIdealMatrix/MinecraftShared")
        credentials {
            username = providers.gradleProperty("gpr.user").getOrNull() ?: System.getenv("GITHUB_USERNAME")
            password = providers.gradleProperty("gpr.key").getOrNull() ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("org.hibernate.orm:hibernate-core:7.0.0.Final")
    compileOnly("org.hibernate.orm:hibernate-c3p0:7.0.0.Final")
    compileOnly("org.hibernate.orm:hibernate-community-dialects:7.0.0.Final")
    implementation("org.bstats:bstats-bukkit:3.1.0")
    implementation("de.kevin_stefan.minecraft:shared-paper:1.0.0")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.1")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand project.properties
    }
}

shadowJar {
    archiveClassifier = ""
    relocate 'org.bstats', 'de.kevin_stefan.virtualChests.bstats'
    relocate 'de.kevin_stefan.minecraft.shared', 'de.kevin_stefan.virtualChests.shared'
}

tasks.build.dependsOn(shadowJar)
